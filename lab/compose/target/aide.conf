# Configuración AIDE para Laboratorio de Hardening & Integridad (target)
# Monitoreo de integridad de archivos críticos (FIM)
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=no
report_url=stdout

# Regla de atributos: permisos, inodo, enlaces, usuario, grupo, tamaño, mtime, ctime y SHA256
NORMAL = p+i+n+u+g+s+m+c+sha256
PERMS  = p+u+g

# Cuentas de usuario y autenticación (MITRE T1078, T1098)
/etc/passwd$        NORMAL
/etc/shadow$        NORMAL
/etc/group$         NORMAL
/etc/gshadow$       NORMAL
/etc/sudoers$       NORMAL
/etc/sudoers\.d/.*$ NORMAL

# Configuración de servicios y acceso remoto
/etc/ssh/.*$        NORMAL
/etc/vsftpd\.conf$  NORMAL

# Tareas programadas y persistencia (MITRE T1053.003)
/etc/crontab$       NORMAL
/etc/cron\..*$      NORMAL

# Binarios del sistema
/bin$               NORMAL
/sbin$              NORMAL
/usr/bin$           NORMAL
/usr/sbin$          NORMAL
/usr/local/bin$     NORMAL
/usr/local/sbin$    NORMAL

# Exclusiones de archivos temporales que mutan legítimamente
!/etc/ld\.so\.cache$
!/etc/mtab$
