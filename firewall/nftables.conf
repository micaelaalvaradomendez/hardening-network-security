#!/usr/sbin/nft -f
# Filtrado perimetral del nodo `fw` (ver docs/filtrado-red.md y docs/arquitectura-red.md).
#
#   [attacker] -- wan -- [fw] -- dmz  -- [target]
#                          \---- mgmt -- [admin]
#
# Política: todo lo que no está permitido explícitamente se descarta.
#   - Desde WAN (zona sin confianza) se usa `drop`: el silencio no da información al atacante.
#   - Desde zonas internas se usa `reject`: el cliente legítimo recibe un error inmediato
#     en lugar de esperar un timeout.
#
# Declarar y borrar la tabla antes de definirla hace la carga idempotente y atómica sin
# tocar otras tablas (por ejemplo, las que crea fail2ban).
# Validar sin cargar:  nft -c -f firewall/nftables.conf

table inet hns_filter
delete table inet hns_filter

table inet hns_filter {

    # ---- Sets: los puertos y hosts permitidos viven acá, no repartidos en las reglas ----

    set public_tcp {
        type inet_service
        comment "TCP que WAN puede alcanzar en los servidores de la DMZ"
        elements = { 80 }
    }

    set mgmt_tcp {
        type inet_service
        comment "TCP que MGMT puede alcanzar en los servidores de la DMZ"
        elements = { 22 }
    }

    set dmz_hosts {
        type ipv4_addr
        comment "Servidores de la DMZ (target)"
        elements = { 10.66.10.10 }
    }

    set mgmt_hosts {
        type ipv4_addr
        comment "Estaciones de administración autorizadas (admin)"
        elements = { 10.66.20.10 }
    }

    # ---- Anti-escaneo ----
    # Se evalúa en prerouting con prioridad `raw` (antes de conntrack): estas combinaciones
    # de flags no existen en tráfico TCP legítimo. Cada regla tiene contador y registra en
    # nflog (grupo 1; se lee con `tcpdump -i nflog:1`), lo que deja evidencia del escaneo.
    #
    # Nota: el XMAS de Nmap (-sX) envía solo FIN|PSH|URG; comparar contra "todos los flags"
    # no lo detecta. Un FIN sin ACK cubre además a -sF. El resto de los escaneos (ACK, Maimon)
    # los clasifica conntrack como `invalid` en las cadenas input y forward.
    chain scan_filter {
        type filter hook prerouting priority raw; policy accept;

        tcp flags & (fin|syn|rst|psh|ack|urg) == 0 counter log prefix "hns-scan-null: " group 1 drop comment "NULL scan (nmap -sN)"
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin|syn|rst|psh|ack|urg counter log prefix "hns-scan-xmas-all: " group 1 drop comment "XMAS con todos los flags"
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin|psh|urg counter log prefix "hns-scan-xmas: " group 1 drop comment "XMAS scan (nmap -sX)"
        tcp flags & (syn|fin) == syn|fin counter log prefix "hns-scan-synfin: " group 1 drop comment "SYN+FIN"
        tcp flags & (syn|rst) == syn|rst counter log prefix "hns-scan-synrst: " group 1 drop comment "SYN+RST"
        tcp flags & (fin|ack) == fin counter log prefix "hns-scan-fin: " group 1 drop comment "FIN sin ACK (nmap -sF)"
    }

    # ---- Tráfico dirigido al propio firewall ----
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid counter drop

        # ICMP esencial. Sin esto se rompen PMTUD y, con IPv6, Neighbor Discovery.
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        iifname "mgmt" icmp type echo-request limit rate 5/second accept

        limit rate 10/second burst 20 packets log prefix "hns-input-drop: " group 1
        iifname "wan" counter drop
        counter reject with icmpx type admin-prohibited
    }

    # ---- Tráfico ruteado entre zonas ----
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid counter drop

        # WAN -> DMZ: solo los puertos publicados hacia los servidores.
        iifname "wan" oifname "dmz" ip daddr @dmz_hosts tcp dport @public_tcp ct state new counter accept comment "WAN->DMZ: servicios publicados"

        # MGMT -> DMZ: SSH solo desde las estaciones autorizadas, con límite de nuevas
        # conexiones (frena fuerza bruta antes de que llegue a fail2ban).
        iifname "mgmt" oifname "dmz" ip saddr @mgmt_hosts ip daddr @dmz_hosts tcp dport @mgmt_tcp ct state new limit rate over 20/minute burst 20 packets log prefix "hns-ssh-ratelimit: " group 1 counter drop comment "SSH: exceso de conexiones nuevas"
        iifname "mgmt" oifname "dmz" ip saddr @mgmt_hosts ip daddr @dmz_hosts tcp dport @mgmt_tcp ct state new counter accept comment "MGMT->DMZ: SSH"
        iifname "mgmt" oifname "dmz" ip saddr @mgmt_hosts ip daddr @dmz_hosts icmp type echo-request limit rate 5/second accept

        # Todo lo demás (WAN->MGMT, DMZ->MGMT, DMZ->WAN, otros puertos): registrar y negar.
        limit rate 10/second burst 20 packets log prefix "hns-fwd-drop: " group 1
        iifname "wan" counter drop
        counter reject with icmpx type admin-prohibited
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
